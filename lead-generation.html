<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlapKap Lead Generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<main class="card">
<div id="formView" class="view">
  <div class="logo">
    <span class="logo-text">FlapKap</span>
    <span class="logo-mark" aria-hidden="true">
      <span class="teal"></span>
      <span class="blue"></span>
    </span>
  </div>

  <h1 class="title">Flapkap lead gen</h1>

  <form id="leadGenForm" novalidate>
    <div class="field">
      <label for="bdrEmail">BDR Email</label>
      <input type="email" id="bdrEmail" name="bdrEmail" placeholder="e.g. jane@company.com" required>
      <span class="error-msg" data-for="bdrEmail"></span>
    </div>

    <div class="field">
      <label for="industry">Industry</label>
      <input type="text" id="industry" name="industry" placeholder="e.g. Technology, Information &amp; Media" required>
      <span class="error-msg" data-for="industry"></span>
    </div>

    <div class="field">
      <label for="request">Specific request</label>
      <input type="text" id="request" name="request" placeholder="e.g. Find me this contact" required>
      <span class="error-msg" data-for="request"></span>
    </div>

    <div class="field">
      <label for="fileLink">Link to Enriched Data</label>
      <input type="url" id="fileLink" name="fileLink" placeholder="Paste a Google Drive, Dropbox, or other file link">
      <span class="error-msg" data-for="fileLink"></span>
    </div>

    <button type="submit" class="confirm-btn">Confirm</button>
  </form>
</div>

<div id="thankYouView" class="view thankyou" hidden>
  <p class="thankyou-headline">
    <span>Thank</span>
    <span class="thankyou-line2">
      <span class="thankyou-arrow" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>You</span>
    </span>
  </p>
  <p class="thankyou-message">
    Your response has been emailed directly to the BDR.
  </p>
</div>
</main>

<script src="lead-generation.js"></script>
</body>
</html>
